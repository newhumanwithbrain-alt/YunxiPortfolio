<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunxi - AI Assisted Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">Yunxi</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <div class="hero-wrapper">
                <div class="profile-image">
                    <div class="profile-container">
                        <img src="https://i.imgur.com/y0te3Eh.jpeg" alt="Yunxi">
                    </div>
                </div>
                <div class="hero-content">
                    <h1>Hi, I'm <span class="gradient-text">Yunxi</span></h1>
                    <p class="subtitle">AI Assisted Student</p>
                    <p class="description">Exploring technology, learning with AI assistance, and creating meaningful projects.</p>
                    <a href="#contact" class="btn btn-primary">Get in Touch</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>Let's Connect</h2>
            <p>Feel free to reach out for collaborations or just to chat!</p>
            <div class="contact-links">
                <a href="https://github.com/newhumanwithbrain-alt" target="_blank" class="contact-link">
                    <span class="icon">💻</span> GitHub
                </a>
                <a href="mailto:your-email@example.com" class="contact-link">
                    <span class="icon">📧</span> Email
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Yunxi. Crafted with passion.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
